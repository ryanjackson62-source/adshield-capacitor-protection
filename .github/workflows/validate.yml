name: Validate AdShield plugin scaffold

on:
  push:
    branches: [main, native-vpn-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  dns-parser:
    name: DNS parser unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create isolated Kotlin test project
        run: |
          mkdir -p .ci-kotlin/src/main/kotlin/com/adshield/protection
          mkdir -p .ci-kotlin/src/test/kotlin/com/adshield/protection
          cp android/src/main/java/com/adshield/protection/DnsQuestionParser.kt .ci-kotlin/src/main/kotlin/com/adshield/protection/
          cp android/src/test/java/com/adshield/protection/DnsQuestionParserTest.kt .ci-kotlin/src/test/kotlin/com/adshield/protection/
          cat > .ci-kotlin/settings.gradle.kts <<'EOF'
          rootProject.name = "adshield-dns-parser-tests"
          EOF
          cat > .ci-kotlin/build.gradle.kts <<'EOF'
          plugins {
              kotlin("jvm") version "2.0.21"
          }
          repositories {
              mavenCentral()
          }
          dependencies {
              testImplementation("junit:junit:4.13.2")
          }
          tasks.test {
              useJUnit()
          }
          EOF
      - name: Run DNS parser tests
        working-directory: .ci-kotlin
        run: gradle test --no-daemon
  android-plugin:
    name: Android Capacitor plugin compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Capacitor Android dependency
        run: npm install --no-save --no-package-lock @capacitor/android@8.0.0
      - name: Create temporary Android host build
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "adshield-android-validation"
          include ":capacitor-android", ":adshield"
          project(":capacitor-android").projectDir = file("node_modules/@capacitor/android/capacitor")
          project(":adshield").projectDir = file("android")
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.13.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
              }
          }
          ext { compileSdkVersion = 36; minSdkVersion = 24; targetSdkVersion = 36 }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Compile AdShield Android plugin against Capacitor 8
        run: gradle :adshield:assembleDebug --no-daemon
